[tool.poetry]
name = "unishield-ai"
version = "2.0.0"
description = "AI-powered cybersecurity assistant for university phishing protection."
authors = ["Raj Bharti <rajbharti06@gmail.com>"]
readme = "..\\README.md"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = "0.115.0"
uvicorn = "0.30.6"
python-multipart = "0.0.9"
pydantic = "2.9.2"
python-dotenv = "1.0.1"
httpx = "0.27.2"
email-validator = "2.2.0"
python-jose = {extras = ["cryptography"], version = "3.3.0"}
openai = ">=1.0.0"
anthropic = ">=0.18.0"
google-generativeai = ">=0.3.0"
pycryptodome = ">=3.19.0"
python-json-logger = "^2.0.7"
pydantic-settings = "^2.3.4"
pytest-cov = "^7.1.0"
feedparser = "^6.0.12"
psutil = "^7.2.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
black = "^24.8.0"
mypy = "^1.11.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
